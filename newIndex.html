<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Found on the Oval</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4f1ec; color: #222; }
    #panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 26px; color: #bb0000; }
    #status { font-size: 20px; margin: 16px 0 4px; }
    #coords { font: 12px ui-monospace, monospace; opacity: .6; }
    button { font: inherit; font-size: 18px; padding: 14px 40px; border: 0; border-radius: 999px; background: #bb0000; color: #fff; font-weight: 600; }
    #object-stage { position: fixed; inset: 0; display: none; z-index: 10; background: #f4f1ec; }
    #object-stage.open { display: block; }
    model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #f4f1ec; }
    model-viewer.open { display: block; }
    body.preview #panel { display: none; }
    #close-model { position: absolute; z-index: 1; top: 16px; left: 16px; padding: 10px 16px; font-size: 15px; }
    body.preview #close-model { display: none; }
    model-viewer [slot="ar-button"] { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); }
    #scout { display: none; width: 100%; max-width: 420px; margin-top: 16px; }
    #scout.on { display: block; }
    #spots { list-style: none; padding: 0; margin: 16px 0 0; text-align: left; font: 13px ui-monospace, monospace; }
    #spots li { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    #spots b { font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Found on the Oval</h1>
    <p>Walk to the spot to unlock the object.</p>
    <button id="go">Start</button>
    <div id="status"></div>
    <div id="coords"></div>
    <button id="open-nearby" hidden>View nearby object</button>

    <!-- Scout mode (?scout): walk the Oval and mark candidate spots -->
    <div id="scout">
      <button id="mark">Mark this spot</button>
      <ul id="spots"></ul>
    </div>
  </div>

  <div id="object-stage">
    <button id="close-model">Back to exploring</button>
    <div id="models"></div>
  </div>

  <script>
    // ADD EACH OBJECT HERE:
    // 1. Put the .glb file in the models/ folder.
    // 2. Set src to its filename, then replace lat and lon with the spot coordinates.
    //    Use Scout mode (?scout) to collect coordinates at the spot.
    // 3. Copy the example entry below for every additional object.
    const OBJECTS = [
      { src: "models/fixedcig+animation.glb", lat: 40.000680, lon: -83.011150, repetitions: 3, playAdditionalAnimations: true, arModes: "webxr" },
      { src: "models/animatedLaptop.glb", lat: 40.000638, lon: -83.011154, repetitions: Infinity, delay: 4000, playAdditionalAnimations: true }
      // Example: { src: "models/my-object.glb", lat: 40.000000, lon: -83.000000 },
    ];
    const RADIUS = 15; // metres. Phone GPS drifts 5–15 m.

    const $status = document.getElementById("status");
    const $coords = document.getElementById("coords");
    const $stage = document.getElementById("object-stage");
    const params = new URLSearchParams(location.search);
    const PREVIEW = params.has("preview");
    const SCOUT = params.has("scout");
    const FAKE = !SCOUT && params.has("fake");
    const $go = document.getElementById("go");
    const $openNearby = document.getElementById("open-nearby");
    let activeObject = null;
    let lastCoords = null;
    let stopAnimation = () => {};
    let gpsWatch = null;
    let waitForNearbyTap = false;

    $openNearby.onclick = () => {
      if (!lastCoords) return;
      waitForNearbyTap = false;
      onPosition({ coords: lastCoords });
    };

    for (const object of OBJECTS) {
      object.unlocked = false;
      object.viewer = document.createElement("model-viewer");
      object.viewer.setAttribute("src", object.src);
      object.viewer.setAttribute("alt", "Found object");
      object.viewer.setAttribute("ar", "");
      object.viewer.setAttribute("ar-modes", object.arModes || "webxr scene-viewer quick-look");
      object.viewer.setAttribute("ar-placement", "floor");
      object.viewer.setAttribute("camera-controls", "");
      object.viewer.autoRotate = false;
      object.viewer.setAttribute("shadow-intensity", "1");
      const arButton = document.createElement("button");
      arButton.slot = "ar-button";
      arButton.textContent = "View in AR";
      object.viewer.append(arButton);
      document.getElementById("models").append(object.viewer);
    }

    function showModel(object) {
      activeObject = object;
      $stage.classList.add("open");
      const viewer = object.viewer;
      viewer.classList.add("open");
      let timer;
      const schedulePlayback = () => {
        timer = setTimeout(() => {
          if (activeObject !== object || !viewer.availableAnimations.length) return;
          viewer.play({ repetitions: object.repetitions });
          if (object.playAdditionalAnimations) {
            for (const animationName of viewer.availableAnimations.slice(1)) {
              viewer.appendAnimation(animationName, { repetitions: object.repetitions });
            }
          }
        }, object.delay || 0);
      };
      if (viewer.loaded) schedulePlayback();
      else viewer.addEventListener("load", schedulePlayback, { once: true });
      stopAnimation = () => {
        clearTimeout(timer);
        viewer.removeEventListener("load", schedulePlayback);
        if (viewer.loaded) viewer.pause();
      };
    }

    document.getElementById("close-model").onclick = () => {
      if (!activeObject) return;
      stopAnimation();
      activeObject.viewer.classList.remove("open");
      activeObject = null;
      $stage.classList.remove("open");
      if (!FAKE && lastCoords) {
        waitForNearbyTap = true;
        onPosition({ coords: lastCoords });
      }
    };

    if (PREVIEW && OBJECTS.length) {
      document.body.classList.add("preview");
      showModel(OBJECTS[0]);
    }

    // ── Scout mode: add ?scout to the URL ──
    // Walk the Oval, tap "Mark this spot", then copy its coordinates into an OBJECTS entry.
    let last = null;
    if (SCOUT) {
      document.querySelector("h1").textContent = "Scout the Oval";
      document.querySelector("#panel p").textContent = "Walk around and mark the spots you like.";
    }

    function onGpsError(err) {
      if (gpsWatch !== null) {
        navigator.geolocation.clearWatch(gpsWatch);
        gpsWatch = null;
      }
      lastCoords = null;
      $openNearby.hidden = true;
      $status.textContent = "GPS error: " + err.message;
      $go.textContent = "Try again";
      $go.hidden = false;
    }

    function onScoutPosition({ coords }) {
      last = coords;
      $status.textContent = `±${Math.round(coords.accuracy)} m ${coords.accuracy <= 10 ? "· good" : "· wait…"}`;
      $coords.textContent = `${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)}`;
    }

    $go.onclick = () => {
      if ($go.hidden) return;
      $go.hidden = true;
      if (FAKE) {
        fakeWalk();
        return;
      }
      if (!navigator.geolocation) {
        onGpsError({ message: "This browser doesn't provide location access." });
        return;
      }
      if (SCOUT) {
        document.getElementById("scout").classList.add("on");
        renderSpots();
      }
      $status.textContent = "Waiting for GPS…";
      gpsWatch = navigator.geolocation.watchPosition(
        SCOUT ? onScoutPosition : onPosition,
        onGpsError,
        { enableHighAccuracy: true, timeout: 15000 }
      );
    };

    // The GPS listener: runs every time the phone reports a new position.
    function onPosition({ coords }, candidates = OBJECTS) {
      lastCoords = coords;
      $coords.textContent = `you: ${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)} · ±${Math.round(coords.accuracy)} m`;
      if (activeObject) return;
      const nearest = candidates.filter((object) => !object.unlocked)
        .map((object) => ({ object, distance: distance(coords.latitude, coords.longitude, object.lat, object.lon) }))
        .sort((a, b) => a.distance - b.distance)[0];
      $openNearby.hidden = true;
      if (!nearest) {
        $status.textContent = "You've found every object.";
      } else if (nearest.distance < RADIUS) {
        if (waitForNearbyTap) {
          $status.textContent = "Another object is nearby.";
          $openNearby.hidden = false;
          return;
        }
        nearest.object.unlocked = true;
        showModel(nearest.object);
        $status.textContent = "Found it.";
      } else {
        waitForNearbyTap = false;
        $status.textContent = `${Math.round(nearest.distance)} m away · head ${compass(coords.latitude, coords.longitude, nearest.object.lat, nearest.object.lon)}`;
      }
    }

    // Desktop test without GPS: approach each object in order and finish once.
    function fakeWalk() {
      let targetIndex = 0;
      let metresSouth = 60;
      const step = () => {
        if (activeObject) return;
        const target = OBJECTS[targetIndex];
        if (!target) {
          clearInterval(timer);
          $status.textContent = "You've found every object.";
          return;
        }
        onPosition({
          coords: { latitude: target.lat - metresSouth / 111320, longitude: target.lon, accuracy: 0 }
        }, [target]);
        if (target.unlocked) {
          targetIndex++;
          metresSouth = 60;
        } else {
          metresSouth = Math.max(0, metresSouth - 5);
        }
      };
      const timer = setInterval(step, 1000);
      step();
    }

    document.getElementById("mark").onclick = () => {
      if (!last) return;
      const note = prompt("Note for this spot (e.g. 'bench by Orton Hall'):") || "";
      const spots = loadSpots();
      spots.push({ lat: +last.latitude.toFixed(6), lon: +last.longitude.toFixed(6), acc: Math.round(last.accuracy), note,
                   time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
      saveSpots(spots);
      renderSpots();
    };

    function renderSpots() {
      document.getElementById("spots").innerHTML = loadSpots().map((s, i) =>
        `<li><b>${i + 1}. ${esc(s.note) || "spot"}</b> · ${s.time} · ±${s.acc} m<br>{ lat: ${s.lat}, lon: ${s.lon} }</li>`
      ).reverse().join("");
    }
    const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    // Spots are kept on this phone (survive reloads). Screenshot the list as a backup.
    function loadSpots() { try { return JSON.parse(localStorage.getItem("spots")) || []; } catch { return []; } }
    function saveSpots(s) { try { localStorage.setItem("spots", JSON.stringify(s)); } catch {} }

    // ── helpers ──
    function distance(lat1, lon1, lat2, lon2) {
      const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
        Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
      return 12742000 * Math.asin(Math.sqrt(a));
    }
    function compass(lat, lon, targetLat, targetLon) {
      const r = Math.PI / 180;
      const y = Math.sin((targetLon - lon) * r) * Math.cos(targetLat * r);
      const x = Math.cos(lat * r) * Math.sin(targetLat * r) - Math.sin(lat * r) * Math.cos(targetLat * r) * Math.cos((targetLon - lon) * r);
      return ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(((Math.atan2(y, x) / r + 360) % 360) / 45) % 8];
    }
  </script>
</body>
</html>
